; ROGUE.AI pumpkins -- stand-alone Halloween decorations, no costume needed.
; See README.md.
;
; Display bring-up (board JSONs, board_configs/*/LGFX_Config.hpp,
; apply_lovyangfx_rgb_patch.py) comes from the Pixelcade Sidekick firmware,
; copied unmodified -- same as ../costume.

[env:rogue-eye-round-2-1]
; Pumpkin eye (src/rogue_eye.cpp): Elecrow CrowPanel 2.1" round knob display
; (ESP32-S3, 480x480 RGB, touch). QIO flash: with DIO the panel shows noise
; while the radio is up (Sidekick finding).
platform = https://github.com/pioarduino/platform-espressif32/releases/download/55.03.311/platform-espressif32.zip
platform_packages =
	framework-arduinoespressif32@https://github.com/espressif/arduino-esp32/releases/download/3.3.11/esp32-core-3.3.11.tar.xz
board = elecrow-crowpanel-round-2-1
board_build.arduino.memory_type = qio_opi
board_build.flash_mode = qio
board_upload.use_1200bps_touch = false
board_upload.wait_for_upload_port = false
framework = arduino
monitor_speed = 115200
extra_scripts =
	pre:apply_lovyangfx_rgb_patch.py
lib_deps =
	lovyan03/LovyanGFX @ 1.2.28
build_src_filter = +<rogue_eye.cpp>
build_flags =
	-D LGFX_USE_V1
	-I board_configs/elecrow-crowpanel-round-2-1

[env:rogue-wide-4827s043c]
; Pumpkin warning screen (src/rogue_wide.cpp): Sunton ESP32-4827S043C 4.3"
; (ESP32-S3, 480x272 RGB). Not interactive.
platform = https://github.com/pioarduino/platform-espressif32/releases/download/55.03.311/platform-espressif32.zip
platform_packages =
	framework-arduinoespressif32@https://github.com/espressif/arduino-esp32/releases/download/3.3.11/esp32-core-3.3.11.tar.xz
board = esp32-4827s043c
framework = arduino
monitor_speed = 115200
lib_deps =
	lovyan03/LovyanGFX @ 1.2.28
extra_scripts = pre:apply_lovyangfx_rgb_patch.py
build_src_filter = +<rogue_wide.cpp>
build_flags =
	-D LGFX_USE_V1
	-I board_configs/esp32-4827s043c
