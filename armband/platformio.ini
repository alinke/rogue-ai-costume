; ARM-7 -- ROGUE.AI's forearm terminal. Sunton ESP32-2432S024C (2.4" 320x240
; ILI9341, CST820 touch, classic ESP32 with its own Bluetooth, RGB LED).
; Display/touch bring-up comes from the Pixelcade Sidekick firmware, copied
; unmodified into board_configs/. See README.md.

[env:armband]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/55.03.311/platform-espressif32.zip
board = esp32dev
board_build.partitions = huge_app.csv
framework = arduino
monitor_speed = 115200
upload_speed = 921600
lib_deps =
	lovyan03/LovyanGFX @ 1.2.28
build_flags =
	-D LGFX_USE_V1
	-I board_configs/esp32-2432s024c
	-Wall
