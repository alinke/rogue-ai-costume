; LAB-7 CONTAINMENT SCANNER -- the researcher's handheld for the ROGUE.AI
; costume. Waveshare ESP32-S3-Touch-LCD-3.49 V2 (172x640 bar LCD, touch,
; speaker, battery). Display/touch/audio bring-up comes from the Pixelcade
; Sidekick firmware, copied unmodified into board_configs/.

[env:scanner]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/55.03.311/platform-espressif32.zip
platform_packages =
	framework-arduinoespressif32@https://github.com/espressif/arduino-esp32/releases/download/3.3.11/esp32-core-3.3.11.tar.xz
board = waveshare-esp32-s3-touch-lcd-3-49
board_build.arduino.memory_type = qio_opi
board_build.flash_mode = qio
board_upload.use_1200bps_touch = false
board_upload.wait_for_upload_port = false
framework = arduino
monitor_speed = 115200
lib_deps =
	lovyan03/LovyanGFX @ 1.2.28
build_flags =
	-D LGFX_USE_V1
	-I board_configs/waveshare-esp32-s3-touch-lcd-3-49
	-Wall

; M5Stack Tab5 (ESP32-P4, 5" 1280x720 touch, speaker, battery). Bluetooth goes
; through the onboard ESP32-C6 (ESP-Hosted); the board variant already has its
; SDIO pins. Flashing this replaces whatever firmware the Tab5 had.
[env:tab5]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/55.03.311/platform-espressif32.zip
board = m5stack-tab5-p4
framework = arduino
monitor_speed = 115200
board_build.partitions = default_16MB.csv
board_upload.flash_size = 16MB
lib_deps =
	lovyan03/LovyanGFX @ 1.2.28
lib_ignore =
	M5GFX
	M5Unified
build_flags =
	-D LGFX_USE_V1
	-D SCANNER_BOARD_TAB5
	-I board_configs/m5stack-tab5
	-Wall

; Speaker check: display bring-up + Tab5Audio's tone only (audiotest/main.cpp).
[env:tab5-audiotest]
extends = env:tab5
build_src_filter = -<*> +<../audiotest/>
build_flags =
	-D LGFX_USE_V1
	-I board_configs/m5stack-tab5
