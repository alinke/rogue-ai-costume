; ROGUE.AI v6.6.6 -- chest terminal firmware for the Guition JC8012P4A1C
; (ESP32-P4, 10.1" 800x1280 MIPI-DSI, GSL3680 touch). See README_ROGUE_AI.md.
;
; Display/touch/backlight bring-up comes from the Pixelcade Sidekick firmware
; (Pixelcade Sidekick, jc8012p4a1c board), copied unmodified into board_configs/.

[env:guition-p4-10-1]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/55.03.311/platform-espressif32.zip
; pioarduino's Tab5 board id: same ESP32-P4 chip, 16MB flash and PSRAM setup.
board = m5stack-tab5-p4
framework = arduino
monitor_speed = 115200
upload_speed = 1500000
; 16MB flash: Espressif's stock 16MB table (6.5MB app slots) -- the headline
; fonts alone are ~1.7MB, more than the default 1.3MB slot.
board_build.partitions = partitions_rogue.csv
board_upload.flash_size = 16MB
lib_deps =
	lovyan03/LovyanGFX @ 1.2.28
; The board id auto-pulls M5GFX/M5Unified, which conflict with LovyanGFX.
lib_ignore =
	M5GFX
	M5Unified
; Log on UART0 (the CH340 USB-C port) rather than native USB CDC, so the same
; cable flashes and shows the log.
build_unflags =
	-DARDUINO_USB_CDC_ON_BOOT=1
build_flags =
	-D LGFX_USE_V1
	-D PIXELCADE_BOARD_JC8012P4A1C
	-D ARDUINO_USB_CDC_ON_BOOT=0
	-I board_configs/jc8012p4a1c
	-Wall

; Older "_Y" panel revision (different JD9365 init table). Only needed if the
; screen shows purple/black bars with the default env.
[env:guition-p4-10-1-old-panel]
extends = env:guition-p4-10-1
build_flags = ${env:guition-p4-10-1.build_flags}
	-D PIXELCADE_JC8012_OLD_PANEL

; The BACKUP costume: Elecrow CrowPanel 7.0 (ESP32-S3, 800x480 RGB, GT911 touch,
; 4MB flash). No camera, speaker, mic, LED strip or battery sense; the scenes
; still draw at 1280x800 and gfx.cpp scales them down to the panel. Display
; bring-up (board JSON, LGFX_Config.hpp, apply_lovyangfx_rgb_patch.py) is
; copied unmodified from the Pixelcade Sidekick firmware (esp32-8048s070c).
; Elecrow CrowPanel Advanced 10.1" (ESP32-P4, 1024x600, speakers, C6): a second
; costume. Flash over the UART0 (CH340K) USB-C port at 115200 without the stub --
; the bridge can't follow esptool's baud change (Sidekick finding). Slow (~8 min).
[env:elecrow-p4-10]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/55.03.311/platform-espressif32.zip
board = m5stack-tab5-p4
framework = arduino
monitor_speed = 115200
upload_speed = 115200
upload_flags = --no-stub
board_build.partitions = partitions_rogue.csv
board_upload.flash_size = 16MB
lib_deps =
	lovyan03/LovyanGFX @ 1.2.28
	ESP_I2S
lib_ignore =
	M5GFX
	M5Unified
build_unflags =
	-DARDUINO_USB_CDC_ON_BOOT=1
build_flags =
	-D LGFX_USE_V1
	-D BOARD_ELECROW_P4_10
	-D ARDUINO_USB_CDC_ON_BOOT=0
	-I board_configs/elecrow-p4-10
	-Wall

; Sunton ESP32-8048S070 7" (ESP32-S3, 800x480, GT911; CH340 USB): a second
; backup, the same as the Elecrow 7" (no camera, sound, mic, LED strip,
; battery or clock). 16 MB flash.
[env:sunton-7]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/55.03.311/platform-espressif32.zip
platform_packages =
	framework-arduinoespressif32@https://github.com/espressif/arduino-esp32/releases/download/3.3.11/esp32-core-3.3.11.tar.xz
board = esp32-8048s070
framework = arduino
board_build.partitions = partitions_rogue.csv
board_upload.flash_size = 16MB
monitor_speed = 115200
upload_speed = 921600
lib_deps =
	lovyan03/LovyanGFX @ 1.2.28
extra_scripts = pre:apply_lovyangfx_rgb_patch.py
build_flags =
	-D BOARD_SUNTON_7
	-D PIXELCADE_S3_RGB_BOUNCE_LINES=20
	-D LGFX_USE_V1
	-I board_configs/esp32-8048s070
	-Wall

[env:elecrow-7]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/55.03.311/platform-espressif32.zip
platform_packages =
	framework-arduinoespressif32@https://github.com/espressif/arduino-esp32/releases/download/3.3.11/esp32-core-3.3.11.tar.xz
board = esp32-8048s070c
framework = arduino
; QIO: with DIO this panel shows noise while the radio is up (Sidekick finding).
board_build.arduino.memory_type = qio_opi
board_build.flash_mode = qio
board_build.partitions = partitions_elecrow7.csv
monitor_speed = 115200
upload_speed = 921600
lib_deps =
	lovyan03/LovyanGFX @ 1.2.28
extra_scripts = pre:apply_lovyangfx_rgb_patch.py
build_flags =
	-D BOARD_ELECROW_7
	-D PIXELCADE_S3_RGB_BOUNCE_LINES=20
	-D LGFX_USE_V1
	-I board_configs/esp32-8048s070c
	-Wall
