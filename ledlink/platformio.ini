; LEDLINK -- the jacket's LED strips on a Gledopto GL-MC-001WL (ESP32, 5 V
; level-shifted output on GPIO16). It follows the costume over Bluetooth and
; runs the costume's own LED code (../costume/src/leds.cpp, copied in at build
; time). See README.md.

[env:gledopto]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/55.03.311/platform-espressif32.zip
board = esp32dev
board_build.partitions = min_spiffs.csv
framework = arduino
monitor_speed = 115200
extra_scripts = pre:copy_leds.py
; NimBLE: far smaller than the core's Bluedroid BLE -- the image has to fit
; WLED's 1.5 MB update slot (it's uploaded through WLED the first time).
lib_deps =
	h2zero/NimBLE-Arduino @ 2.3.6
build_flags =
	-Wall
